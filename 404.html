<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>ClassHub v2</title>
    <!--
      เทคนิค spa-github-pages: GitHub Pages ไม่รู้จัก route ของ React Router
      (เช่น /classhub-v2/attendance) เพราะเป็น static host ธรรมดา ไม่มีไฟล์จริงชื่อนี้
      พอเจอ path ที่ไม่มีไฟล์จริง GitHub Pages จะเสิร์ฟไฟล์นี้ (404.html) แทนเสมอ
      สคริปต์นี้จะเข้ารหัส path เดิมใส่ query string แล้ว redirect กลับไปที่ index.html
      จากนั้น script ใน index.html จะถอดรหัสกลับมาให้ React Router ทำงานต่อได้ปกติ
      อ้างอิง: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // เก็บ /classhub-v2 ไว้ 1 ระดับ (ชื่อ repo)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
